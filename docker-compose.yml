x-redash-service: &redash-service
  image: redash/redash:26.3.0
  restart: unless-stopped
  environment: &redash-environment
    PYTHONUNBUFFERED: "0"
    REDASH_LOG_LEVEL: INFO
    REDASH_DATABASE_URL: ${REDASH_DATABASE_URL}
    REDASH_REDIS_URL: ${REDASH_REDIS_URL}
    REDASH_SECRET_KEY: ${REDASH_SECRET_KEY}
    REDASH_COOKIE_SECRET: ${REDASH_COOKIE_SECRET}
    REDASH_HOST: ${REDASH_HOST}
    REDASH_ENFORCE_CSRF: "true"

services:
  mongodb:
    image: mongo:7.0.14
    container_name: ulakbim-mongodb
    restart: unless-stopped
    environment:
      MONGO_INITDB_ROOT_USERNAME: ${MONGODB_ROOT_USERNAME}
      MONGO_INITDB_ROOT_PASSWORD: ${MONGODB_ROOT_PASSWORD}
      MONGO_INITDB_DATABASE: ${MONGODB_DATABASE}
    ports:
      - "${MONGODB_HOST}:${MONGODB_PORT}:27017"
    volumes:
      - mongodb_data:/data/db
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "mongosh --quiet --host 127.0.0.1 --port 27017 --username \"$$MONGO_INITDB_ROOT_USERNAME\" --password \"$$MONGO_INITDB_ROOT_PASSWORD\" --authenticationDatabase admin --eval \"db.adminCommand('ping').ok\" | grep 1",
        ]
      interval: 5s
      timeout: 5s
      retries: 12
      start_period: 10s

  redash-postgres:
    image: pgautoupgrade/pgautoupgrade:17-alpine
    container_name: ulakbim-redash-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${REDASH_POSTGRES_USER}
      POSTGRES_PASSWORD: ${REDASH_POSTGRES_PASSWORD}
      POSTGRES_DB: ${REDASH_POSTGRES_DATABASE}
    volumes:
      - redash_postgres_data:/var/lib/postgresql/data
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "pg_isready -U \"$$POSTGRES_USER\" -d \"$$POSTGRES_DB\"",
        ]
      interval: 5s
      timeout: 5s
      retries: 12
      start_period: 10s

  redash-redis:
    image: redis:7-alpine
    container_name: ulakbim-redash-redis
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 12
      start_period: 5s

  redash-server:
    <<: *redash-service
    container_name: ulakbim-redash-server
    command: server
    depends_on:
      redash-postgres:
        condition: service_healthy
      redash-redis:
        condition: service_healthy
    ports:
      - "127.0.0.1:${REDASH_PORT}:5000"
    healthcheck:
      test:
        [
          "CMD",
          "python",
          "-c",
          "import urllib.request; urllib.request.urlopen('http://127.0.0.1:5000/ping', timeout=3).read()",
        ]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 20s

  redash-scheduler:
    <<: *redash-service
    container_name: ulakbim-redash-scheduler
    command: scheduler
    depends_on:
      redash-server:
        condition: service_healthy

  redash-worker:
    <<: *redash-service
    container_name: ulakbim-redash-worker
    command: worker
    depends_on:
      redash-server:
        condition: service_healthy
    environment:
      <<: *redash-environment
      QUEUES: periodic,emails,default
      WORKERS_COUNT: 1

  redash-scheduled-worker:
    <<: *redash-service
    container_name: ulakbim-redash-scheduled-worker
    command: worker
    depends_on:
      redash-server:
        condition: service_healthy
    environment:
      <<: *redash-environment
      QUEUES: scheduled_queries,schemas
      WORKERS_COUNT: 1

  redash-adhoc-worker:
    <<: *redash-service
    container_name: ulakbim-redash-adhoc-worker
    command: worker
    depends_on:
      redash-server:
        condition: service_healthy
    environment:
      <<: *redash-environment
      QUEUES: queries
      WORKERS_COUNT: 2

volumes:
  mongodb_data:
  redash_postgres_data:
