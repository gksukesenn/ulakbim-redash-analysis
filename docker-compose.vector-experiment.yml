services:
  qdrant:
    image: qdrant/qdrant:v1.15.4
    container_name: ulakbim-vector-experiment-qdrant
    restart: unless-stopped
    ports:
      - "127.0.0.1:6333:6333"
    volumes:
      - qdrant_experiment_data:/qdrant/storage
    healthcheck:
      test:
        ["CMD-SHELL", "bash -c ':> /dev/tcp/127.0.0.1/6333'"]
      interval: 5s
      timeout: 3s
      retries: 12
      start_period: 5s

volumes:
  qdrant_experiment_data:
